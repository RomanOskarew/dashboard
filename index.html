<script>
const LS_KEY = "avtozapchasti_dashboard_urls";
let rowsSdelki = [];
let rowsKanaly = [];
let profitChart, roiChart, ownershipPie;

// Безопасный парсинг чисел (обрабатывает "1 234,56", "1,234.56" и "₽")
function parseNum(v){
  if(v===null||v===undefined) return 0;
  let s = String(v).trim();
  if(s==="") return 0;
  s = s.replace(/[₽%\s\u00A0]/g,"");
  if(s.includes(",") && !s.includes(".")){ s = s.replace(",", "."); }
  else if(s.includes(",") && s.includes(".")){ 
    if(s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
    else s = s.replace(/,/g,"");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseDateRu(v){
  if(!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  let d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function norm(s){
  return String(s||"").toLowerCase().replace(/[^a-zа-яё0-9]/gi,"");
}

// Более строгий и безопасный поиск колонок
function getField(row, names){
  const keys = Object.keys(row);
  // 1. Точное совпадение
  for(const n of names){
    if(row[n] !== undefined && String(row[n]).trim() !== "") return row[n];
  }
  // 2. Нормализованное совпадение
  for(const n of names){
    const target = norm(n);
    if(!target) continue;
    for(const k of keys){
      if(norm(k) === target && String(row[k]).trim() !== "") return row[k];
    }
  }
  // 3. Частичное совпадение (защита от коротких слов типа "Цена")
  for(const n of names){
    const target = norm(n);
    if(!target || target.length < 4) continue;
    for(const k of keys){
      const kn = norm(k);
      if((kn.startsWith(target) || target.startsWith(kn)) && String(row[k]).trim() !== ""){
        return row[k];
      }
    }
  }
  return undefined;
}

function fmtMoney(n){ return Math.round(n).toLocaleString("ru-RU") + " ₽"; }
function fmtPct(n){ return (n*100).toFixed(1) + "%"; }

function fetchCsv(url){
  return new Promise((resolve, reject)=>{
    const bust = url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now();
    Papa.parse(bust, {
      download:true, header:true, skipEmptyLines:true,
      complete: res => resolve(res.data),
      error: err => reject(err)
    });
  });
}

const FIELD = {
  category: ["Категория детали"],
  type: ["Тип (б/у/Новый)", "Тип товара", "Тип"],
  ownership: ["Схема работы", "Схема"],
  share: ["Доля, %", "Доля"],
  myMargin: ["Моя маржа, ₽","Моя маржа","Маржа, ₽","Маржа ₽","Маржа"],
  owed: ["К выплате владельцу, ₽","К выплате владельцу"],
  paidStatus: ["Выплачено владельцу","Выплачено"],
  sale: ["Цена продажи"],
  buy: ["Цена закупки"],
  extra: ["Доп. расходы", "Доп расходы"],
  saleDate: ["Дата продажи"],
  channel: ["Канал продажи"],
  brand: ["Марка/модель авто","Марка/модель"],
};
const KFIELD = {
  channel: ["Канал"],
  month: ["Месяц"],
  spend: ["Затраты на рекламу","Затраты"],
  sales: ["Число продаж","Количество продаж","Количество сделок"],
  revenue: ["Выручка"],
  profit: ["Чистая прибыль","Прибыль", "Моя прибыль (с учётом рекламы)"],
};

function computeMargin(row){
  const explicit = getField(row, FIELD.myMargin);
  if(explicit !== undefined && String(explicit).trim() !== ""){
    return parseNum(explicit);
  }
  const sale = parseNum(getField(row, FIELD.sale));
  const buy  = parseNum(getField(row, FIELD.buy));
  const extra = parseNum(getField(row, FIELD.extra));
  const scheme = String(getField(row, FIELD.ownership) || "").trim().toLowerCase();
  
  let share = parseNum(getField(row, FIELD.share));
  if(share > 0 && share <= 1) share = share * 100; // Защита от 0.5 вместо 50

  if(scheme.includes("комис") && share > 0){
    return sale * share / 100 - extra;
  }
  return sale - buy - extra;
}

function computeOwed(row){
  const explicit = getField(row, FIELD.owed);
  if(explicit !== undefined && String(explicit).trim() !== ""){
    return parseNum(explicit);
  }
  const sale = parseNum(getField(row, FIELD.sale));
  const scheme = String(getField(row, FIELD.ownership) || "").trim().toLowerCase();
  
  let share = parseNum(getField(row, FIELD.share));
  if(share > 0 && share <= 1) share = share * 100;

  if(scheme.includes("комис") && share > 0){
    return sale * (1 - share/100);
  }
  return 0;
}

async function loadData(){
  const url1 = document.getElementById("url1").value.trim();
  const url2 = document.getElementById("url2").value.trim();
  const status = document.getElementById("status");
  if(!url1 || !url2){ status.textContent = "Заполните обе ссылки."; status.style.color="var(--bad)"; return; }
  status.textContent = "Загрузка...";
  status.style.color = "#888";
  document.getElementById("loadingMsg").style.display="block";
  document.getElementById("loadingMsg").textContent = "Загрузка данных из Google Таблицы...";
  document.getElementById("dashboardContent").style.display="none";
  try{
    rowsSdelki = await fetchCsv(url1);
    rowsKanaly = await fetchCsv(url2);
    rowsSdelki = rowsSdelki.filter(r => Object.values(r).some(v=>String(v).trim()!==""));
    rowsKanaly = rowsKanaly.filter(r => Object.values(r).some(v=>String(v).trim()!==""));
    localStorage.setItem(LS_KEY, JSON.stringify({url1,url2}));
    status.textContent = "✅ Данные загружены (" + rowsSdelki.length + " сделок, " + rowsKanaly.length + " строк по каналам).";
    status.style.color = "var(--good)";
    document.getElementById("debugBox").textContent = "Колонки «Сделки»: " + (rowsSdelki[0] ? Object.keys(rowsSdelki[0]).join(" | ") : "нет данных") +
      "\n\nКолонки «Каналы по месяцам»: " + (rowsKanaly[0] ? Object.keys(rowsKanaly[0]).join(" | ") : "нет данных");
    document.getElementById("loadingMsg").style.display="none";
    document.getElementById("dashboardContent").style.display="block";
    renderAll();
  }catch(e){
    status.textContent = "Ошибка загрузки. Проверьте ссылки.";
    status.style.color = "var(--bad)";
  }
}

function renderAll(){
  const target = parseFloat(document.getElementById("targetInput").value) || 500000;

  // KPI
  let totalRevenue = 0, totalMyProfit = 0, totalOwed = 0;
  rowsSdelki.forEach(r=>{
    totalRevenue += parseNum(getField(r, FIELD.sale));
    totalMyProfit += computeMargin(r);
    
    const paidRaw = String(getField(r, FIELD.paidStatus) || "").trim().toLowerCase();
    const isPaid = ["да", "yes", "true", "1", "оплачено"].includes(paidRaw);
    if(!isPaid) totalOwed += computeOwed(r);
  });
  document.getElementById("kpiRevenue").textContent = fmtMoney(totalRevenue);
  document.getElementById("kpiProfit").textContent = fmtMoney(totalMyProfit);
  document.getElementById("kpiOwed").textContent = fmtMoney(totalOwed);

  // Прибыль по месяцам 
  const monthMap = {};
  rowsKanaly.forEach(r=>{
    const rawMonth = String(getField(r, KFIELD.month) || "").trim();
    if(!rawMonth) return;
    // Отрезаем название канала: "06.2026 Авто-1" превращается в "06.2026"
    const m = rawMonth.split(" ")[0]; 
    monthMap[m] = (monthMap[m]||0) + parseNum(getField(r, KFIELD.profit));
  });
  
  // Правильная сортировка месяцев
  const months = Object.keys(monthMap).sort((a,b) => {
      const [mA, yA] = a.split('.').map(Number);
      const [mB, yB] = b.split('.').map(Number);
      return (yA * 100 + mA) - (yB * 100 + mB);
  });
  
  const profits = months.map(m=>monthMap[m]);
  const lastMonthProfit = profits.length ? profits[profits.length-1] : 0;
  document.getElementById("kpiTarget").textContent = target ? fmtPct(lastMonthProfit/target) : "—";

  if(profitChart) profitChart.destroy();
  profitChart = new Chart(document.getElementById("profitChart"), {
    type:"line",
    data:{ labels: months, datasets:[
      { label:"Моя чистая прибыль", data: profits, borderColor:"#1E2761", backgroundColor:"rgba(30,39,97,.15)", fill:true, tension:.3 },
      { label:"Цель", data: months.map(()=>target), borderColor:"#D7263D", borderDash:[6,4], pointRadius:0 }
    ]},
    options:{ responsive:true, plugins:{legend:{position:"bottom"}}, scales:{y:{beginAtZero:true}} }
  });

  // ROI по каналам
  const chanAgg = {};
  rowsKanaly.forEach(r=>{
    const c = String(getField(r, KFIELD.channel) || "").trim();
    if(!c) return;
    if(!chanAgg[c]) chanAgg[c] = {spend:0, profit:0};
    chanAgg[c].spend  += parseNum(getField(r, KFIELD.spend));
    chanAgg[c].profit += parseNum(getField(r, KFIELD.profit));
  });
  const chanNames = Object.keys(chanAgg);
  const roiValues = chanNames.map(c => chanAgg[c].spend ? chanAgg[c].profit/chanAgg[c].spend : 0);
  const roiColors = roiValues.map(v => v<1 ? "#D7263D" : v<1.5 ? "#F4A537" : "#02C39A");

  if(roiChart) roiChart.destroy();
  roiChart = new Chart(document.getElementById("roiChart"), {
    type:"bar",
    data:{ labels: chanNames, datasets:[{ label:"ROI", data: roiValues, backgroundColor: roiColors }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });

  // Свой товар vs Комиссия
  const ownAgg = {};
  rowsSdelki.forEach(r=>{
    const t = String(getField(r, FIELD.ownership) || "Свой").trim();
    ownAgg[t] = (ownAgg[t]||0) + 1;
  });
  if(ownershipPie) ownershipPie.destroy();
  ownershipPie = new Chart(document.getElementById("ownershipPie"), {
    type:"doughnut",
    data:{ labels: Object.keys(ownAgg), datasets:[{ data: Object.values(ownAgg),
      backgroundColor:["#1E2761","#F4A537","#02C39A","#D7263D"] }] },
    options:{ responsive:true, plugins:{legend:{position:"right"}} }
  });

  // Маржа по категориям
  const catAgg = {};
  rowsSdelki.forEach(r=>{
    const cat = String(getField(r, FIELD.category) || "Без категории").trim();
    if(!catAgg[cat]) catAgg[cat] = {margin:0, count:0};
    catAgg[cat].margin += computeMargin(r);
    catAgg[cat].count += 1;
  });
  const catRows = Object.entries(catAgg).sort((a,b)=>b[1].margin-a[1].margin).slice(0,10);
  let catHtml = "<table><tr><th>Категория</th><th>Сделок</th><th>Моя прибыль</th></tr>";
  catRows.forEach(([cat,d])=>{
    catHtml += `<tr><td>${cat}</td><td>${d.count}</td><td>${fmtMoney(d.margin)}</td></tr>`;
  });
  catHtml += "</table>";
  document.getElementById("categoryTable").innerHTML = catHtml || "<p>Нет данных</p>";

  // Новые vs Б/у
  const typeAgg = {};
  rowsSdelki.forEach(r=>{
    const t = String(getField(r, FIELD.type) || "—").trim();
    if(!typeAgg[t]) typeAgg[t] = {margin:0, count:0};
    typeAgg[t].margin += computeMargin(r);
    typeAgg[t].count += 1;
  });
  let typeHtml = "<table><tr><th>Тип товара</th><th>Сделок</th><th>Моя прибыль</th><th>Средняя</th></tr>";
  Object.entries(typeAgg).forEach(([t,d])=>{
    typeHtml += `<tr><td>${t}</td><td>${d.count}</td><td>${fmtMoney(d.margin)}</td><td>${fmtMoney(d.count ? d.margin/d.count : 0)}</td></tr>`;
  });
  typeHtml += "</table>";
  document.getElementById("typeTable").innerHTML = typeHtml;

  // Последние сделки
  const sorted = [...rowsSdelki].sort((a,b)=>{
    const da = parseDateRu(getField(a, FIELD.saleDate)) || new Date(0);
    const db = parseDateRu(getField(b, FIELD.saleDate)) || new Date(0);
    return db - da;
  }).slice(0,10);
  
  let recHtml = "<table><tr><th>Дата</th><th>Марка/модель</th><th>Схема</th><th>Канал</th><th>Цена продажи</th><th>Моя прибыль</th></tr>";
  sorted.forEach(r=>{
    const scheme = String(getField(r, FIELD.ownership) || "Свой").trim();
    const pillClass = scheme.toLowerCase().includes("комис") ? "cons" : "own";
    recHtml += `<tr>
      <td>${getField(r, FIELD.saleDate) || "—"}</td>
      <td>${getField(r, FIELD.brand) || "—"}</td>
      <td><span class="pill ${pillClass}">${scheme}</span></td>
      <td>${getField(r, FIELD.channel) || "—"}</td>
      <td>${fmtMoney(parseNum(getField(r, FIELD.sale)))}</td>
      <td>${fmtMoney(computeMargin(r))}</td>
    </tr>`;
  });
  recHtml += "</table>";
  document.getElementById("recentTable").innerHTML = recHtml;
}

document.getElementById("saveBtn").addEventListener("click", loadData);
document.getElementById("refreshBtn").addEventListener("click", loadData);
document.getElementById("targetInput").addEventListener("change", ()=>{ if(rowsSdelki.length) renderAll(); });
document.getElementById("debugToggle").addEventListener("change", (e)=>{
  document.getElementById("debugBox").style.display = e.target.checked ? "block" : "none";
});

window.addEventListener("load", ()=>{
  const saved = localStorage.getItem(LS_KEY);
  if(saved){
    try{
      const {url1,url2} = JSON.parse(saved);
      document.getElementById("url1").value = url1 || "";
      document.getElementById("url2").value = url2 || "";
      if(url1 && url2){
        document.getElementById("settingsPanel").removeAttribute("open");
        loadData();
      }
    }catch(e){}
  }
});
</script>
